<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="ad-title ad-desc" class="ad">
<title id="ad-title">Unity Pipeline architecture overview</title>
<desc id="ad-desc">Your tool and your runtime player call the Pipeline API, which fronts Project Service. Project Service holds workbenches, environments and an artifact cache. It clones from and publishes to your git repository, using credentials from a Build Automation VCS connection.</desc>
<style>
.ad { --ad-gray-fill:#F1EFE8; --ad-gray-line:#5F5E5A; --ad-gray-title:#444441; --ad-gray-sub:#5F5E5A;
      --ad-api-fill:#EEEDFE; --ad-api-line:#534AB7; --ad-api-title:#3C3489; --ad-api-sub:#534AB7;
      --ad-ps-fill:#E1F5EE; --ad-ps-line:#0F6E56; --ad-ps-inner:#FFFFFF; --ad-ps-title:#085041; --ad-ps-sub:#0F6E56; --ad-arrow:#888780; }
@media (prefers-color-scheme: dark) { .ad {
      --ad-gray-fill:#444441; --ad-gray-line:#B4B2A9; --ad-gray-title:#F1EFE8; --ad-gray-sub:#D3D1C7;
      --ad-api-fill:#3C3489; --ad-api-line:#AFA9EC; --ad-api-title:#EEEDFE; --ad-api-sub:#CECBF6;
      --ad-ps-fill:#04342C; --ad-ps-line:#5DCAA5; --ad-ps-inner:#085041; --ad-ps-title:#E1F5EE; --ad-ps-sub:#9FE1CB; } }
</style>
<g class="ad-shapes" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central">
<defs><marker id="ad-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--ad-arrow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="70" width="130" height="56" rx="8" fill="var(--ad-gray-fill)" stroke="var(--ad-gray-line)" stroke-width="0.75"/>
<text x="105" y="89" font-size="14" font-weight="600" fill="var(--ad-gray-title)">Your tool</text>
<text x="105" y="108" font-size="12" fill="var(--ad-gray-sub)">C#, curl</text>

<rect x="40" y="170" width="130" height="56" rx="8" fill="var(--ad-gray-fill)" stroke="var(--ad-gray-line)" stroke-width="0.75"/>
<text x="105" y="189" font-size="14" font-weight="600" fill="var(--ad-gray-title)">Runtime player</text>
<text x="105" y="208" font-size="12" fill="var(--ad-gray-sub)">Loads .ca files</text>

<rect x="220" y="70" width="120" height="156" rx="8" fill="var(--ad-api-fill)" stroke="var(--ad-api-line)" stroke-width="0.75"/>
<text x="280" y="138" font-size="14" font-weight="600" fill="var(--ad-api-title)">Pipeline API</text>
<text x="280" y="158" font-size="12" fill="var(--ad-api-sub)">One front door</text>

<rect x="390" y="40" width="250" height="250" rx="20" fill="var(--ad-ps-fill)" stroke="var(--ad-ps-line)" stroke-width="0.75"/>
<text x="515" y="62" font-size="14" font-weight="600" fill="var(--ad-ps-title)">Project Service</text>

<rect x="410" y="84" width="210" height="52" rx="8" fill="var(--ad-ps-inner)" stroke="var(--ad-ps-line)" stroke-width="0.75"/>
<text x="515" y="101" font-size="14" font-weight="600" fill="var(--ad-ps-title)">Workbench</text>
<text x="515" y="120" font-size="12" fill="var(--ad-ps-sub)">Git checkout, revisions</text>

<rect x="410" y="152" width="210" height="52" rx="8" fill="var(--ad-ps-inner)" stroke="var(--ad-ps-line)" stroke-width="0.75"/>
<text x="515" y="169" font-size="14" font-weight="600" fill="var(--ad-ps-title)">Environment</text>
<text x="515" y="188" font-size="12" fill="var(--ad-ps-sub)">Editor per platform</text>

<rect x="410" y="220" width="210" height="52" rx="8" fill="var(--ad-ps-inner)" stroke="var(--ad-ps-line)" stroke-width="0.75"/>
<text x="515" y="237" font-size="14" font-weight="600" fill="var(--ad-ps-title)">Artifact cache</text>
<text x="515" y="256" font-size="12" fill="var(--ad-ps-sub)">Import results</text>

<rect x="440" y="330" width="150" height="44" rx="8" fill="var(--ad-gray-fill)" stroke="var(--ad-gray-line)" stroke-width="0.75"/>
<text x="515" y="352" font-size="14" font-weight="600" fill="var(--ad-gray-title)">Git repository</text>

<rect x="220" y="330" width="160" height="44" rx="8" fill="var(--ad-gray-fill)" stroke="var(--ad-gray-line)" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="300" y="352" font-size="14" font-weight="600" fill="var(--ad-gray-title)">Build Automation</text>

<g stroke="var(--ad-arrow)" stroke-width="1.5" fill="none">
<line x1="172" y1="98" x2="216" y2="98" marker-end="url(#ad-arrow)"/>
<line x1="172" y1="198" x2="216" y2="198" marker-end="url(#ad-arrow)"/>
<line x1="342" y1="148" x2="386" y2="148" marker-end="url(#ad-arrow)"/>
<line x1="515" y1="294" x2="515" y2="326" marker-start="url(#ad-arrow)" marker-end="url(#ad-arrow)"/>
<line x1="382" y1="352" x2="436" y2="352" stroke-dasharray="4 3" marker-end="url(#ad-arrow)"/>
</g>
</g>
</svg>
